<footer>ULTRASITE · 2026</footer>

<script>
const ADD_PASSWORD = "14882014160100001234";

const categories = {
  tech: {
    title: "🖥️ Моя техника",
    description: "Компьютеры, телефоны и другие устройства."
  },
  cats: {
    title: "🐈 Мои коты",
    description: "Истории и фотографии моих котиков."
  },
  fish: {
    title: "🐟 Мой подводный мир",
    description: "Рыбки, креветки и аквариумные растения."
  },
  games: {
    title: "🎮 Мои игры",
    description: "Любимые игры, достижения и скриншоты."
  }
};

let currentPage = "home";

function getEntries(category) {
  try {
    return JSON.parse(localStorage.getItem("ultrasite_" + category)) || [];
  } catch {
    return [];
  }
}

function openPage(page) {
  currentPage = page;
  document.getElementById("home").classList.toggle("hidden", page !== "home");
  document.getElementById("category").classList.toggle("hidden", page === "home");
  document.getElementById("editor").classList.add("hidden");

  if (page === "home") return;

  document.getElementById("pageTitle").textContent = categories[page].title;
  document.getElementById("pageDescription").textContent = categories[page].description;
  renderEntries();
}

function renderEntries() {
  const container = document.getElementById("entries");
  container.replaceChildren();

  const entries = getEntries(currentPage);

  if (!entries.length) {
    const empty = document.createElement("p");
    empty.className = "muted";
    empty.textContent = "Пока здесь пусто. Можно добавить первую запись!";
    container.appendChild(empty);
  }

  entries.forEach(entry => {
    const card = document.createElement("article");
    card.className = "entry";

    const title = document.createElement("h3");
    title.textContent = entry.title;
    card.appendChild(title);

    const description = document.createElement("p");
    description.textContent = entry.text || "";
    card.appendChild(description);

    if (entry.image && /^https?:\/\//i.test(entry.image)) {
      const image = document.createElement("img");
      image.src = entry.image;
      image.alt = entry.title;
      image.loading = "lazy";
      card.appendChild(image);
    }

    container.appendChild(card);
  });
}

function addEntry() {
  const password = prompt("Введи пароль для добавления записи:");
  if (password === null) return;

  if (password !== ADD_PASSWORD) {
    alert("Неверный пароль!");
    return;
  }

  document.getElementById("entryForm").reset();
  document.getElementById("category").classList.add("hidden");
  document.getElementById("editor").classList.remove("hidden");
}

document.getElementById("entryForm").addEventListener("submit", event => {
  event.preventDefault();

  const title = document.getElementById("entryTitle").value.trim();
  const text = document.getElementById("entryText").value.trim();
  const image = document.getElementById("entryImage").value.trim();

  if (!title) return;

  if (image && !/^https?:\/\//i.test(image)) {
    alert("Ссылка на фото должна начинаться с http:// или https://");
    return;
  }

  const entries = getEntries(currentPage);
  entries.push({ title, text, image });

  try {
    localStorage.setItem("ultrasite_" + currentPage, JSON.stringify(entries));
  } catch {
    alert("Не удалось сохранить запись. Возможно, закончилось место.");
    return;
  }

  openPage(currentPage);
});
</script>
</body>
</html>
